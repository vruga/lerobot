\* Configuration for testing with network failures enabled
\* NOTE: Liveness properties may fail with network failures enabled,
\* as messages can be dropped. This tests safety properties under failures.

SPECIFICATION Spec

CONSTANTS
  MaxTimestep = 5
  Actions = {a0, a1}
  Payloads = {p0}
  ActionsPerChunk = 2
  IncomingChunkQueueMax = 2
  ScheduleMaxFactor = 2
  ChunkSizeThresholdNum = 1
  ChunkSizeThresholdDen = 2
  \* Enable network failures
  EnableNetworkFailures = TRUE
  EnableServerTimeout = TRUE

\* Safety invariants should still hold under network failures
INVARIANT TypeOK
INVARIANT Inv_IncomingQueueBound
INVARIANT Inv_ObsSlotType
INVARIANT Inv_ScheduleOnlyFuture
INVARIANT Inv_ActionChunkSizeBound
INVARIANT Inv_AggregationProducesValidActions

\* Note: Liveness properties are disabled because they may not hold
\* when messages can be dropped
\* PROPERTY Live_IfScheduleNonEmptyEventuallyExec
\* PROPERTY Live_MustGoObsEventuallyProducesChunk
