\* Configuration for testing with abstract aggregation
\* WARNING: This is significantly more expensive for TLC due to non-determinism.
\* Use smaller constants to keep state space manageable.

SPECIFICATION SpecWithAggregation

CONSTANTS
  \* Reduced constants for tractable model checking with aggregation
  MaxTimestep = 4
  Actions = {a0, a1}
  Payloads = {p0}
  ActionsPerChunk = 2
  IncomingChunkQueueMax = 2
  ScheduleMaxFactor = 2
  ChunkSizeThresholdNum = 1
  ChunkSizeThresholdDen = 2
  \* Disable failures to focus on aggregation behavior
  EnableNetworkFailures = FALSE
  EnableServerTimeout = FALSE

INVARIANT TypeOK
INVARIANT Inv_IncomingQueueBound
INVARIANT Inv_ObsSlotType
INVARIANT Inv_ScheduleOnlyFuture
INVARIANT Inv_ActionChunkSizeBound
INVARIANT Inv_AggregationProducesValidActions
INVARIANT Inv_NotDeadlocked

PROPERTY Live_IfScheduleNonEmptyEventuallyExec
PROPERTY Live_MustGoObsEventuallyProducesChunk
